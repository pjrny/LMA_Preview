<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likeness Monetization Agent (LMA) - Creator Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .glass-input { background: rgba(17, 24, 39, 0.6); border: 1px solid rgba(75, 85, 99, 0.6); color: white; }
        .glass-input:focus { outline: none; border-color: #6366f1; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- CONFIGURATION ---
        const API_KEY = "AIzaSyCaDwuhn_Moho7LAT8pZsnPJUX-kJHU6DM"; 
        const MODEL_CHAT = "gemini-1.5-flash";
        const MODEL_IMAGE = "imagen-3.0-generate-002"; 
        
        const PLACEHOLDER_IMG = "https://placehold.co/600x400/1f2937/gray?text=Asset+Preview";

        const VerificationLevels = [
            { level: 1, title: "Email/Phone", status: "Verified", icon: "mail" },
            { level: 2, title: "Selfie Upload", status: "Pending", icon: "camera" },
            { level: 3, title: "Body Scan", status: "Locked", icon: "scan" },
            { level: 4, title: "Gov ID", status: "Locked", icon: "id-card" },
            { level: 5, title: "CV Upload", status: "Locked", icon: "file-text" },
            { level: 6, title: "Socials (Bluesky)", status: "Locked", icon: "share-2" },
            { level: 7, title: "Therapist Session", status: "Coming Soon", icon: "brain" },
        ];

        // --- COMPONENT: ICON HELPER ---
        const Icon = ({ name, size = 20, className }) => {
            const icons = {
                mail: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 7L2 7"/></svg>,
                camera: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
                scan: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>,
                "id-card": <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="9" r="2"/><rect width="20" height="14" x="2" y="5" rx="2"/></svg>,
                "file-text": <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
                "share-2": <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>,
                brain: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
                check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
                upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                send: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
                help: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>,
                download: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
                zap: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
                image: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
                camera: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
                dog: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 5.172C10 3.782 8.423 2.679 6.5 3c-2.823.47-4.113 6.006-4 7 .08.703 1.725 1.722 3.656 1 1.261-.472 1.96-1.45 2.344-2.5"/><path d="M14.267 5.172c0-1.39 1.577-2.493 3.5-2.172 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.96-1.45-2.344-2.5"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/><path d="M4.42 11.247A4.335 4.335 0 0 1 6.944 9a4.423 4.423 0 0 1 2.997.686 1.991 1.991 0 0 1 2.058.001A4.423 4.423 0 0 1 15.056 9a4.335 4.335 0 0 1 2.525 2.247"/><path d="M14 14.5c-.789 2.653-2.61 4.63-4.62 4.63-2.01 0-3.83-1.977-4.62-4.63"/></svg>,
                shopping: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
                activity: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
                trash: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            };
            return icons[name] || <span className="text-xs">?</span>;
        };

        // --- API HELPER: GEMINI ---
        const callGeminiChat = async (history, systemInstruction) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_CHAT}:generateContent?key=${API_KEY}`;
            const contents = history.map(msg => ({
                role: msg.role === 'user' ? 'user' : 'model',
                parts: [{ text: msg.text }]
            }));
            
            const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                console.error("Gemini Chat Error", e);
                return "I'm having trouble connecting. Please check the API key.";
            }
        };

        const callImagen = async (prompt) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_IMAGE}:predict?key=${API_KEY}`;
            const payload = {
                instances: [{ prompt: prompt }],
                parameters: { sampleCount: 1, aspectRatio: "1:1" }
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(response.statusText);
                
                const data = await response.json();
                if (data.predictions && data.predictions[0] && data.predictions[0].bytesBase64Encoded) {
                    return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                }
                throw new Error("No image data returned");
            } catch (e) {
                console.warn("Real Image Gen Failed (Likely Permission/Scope), falling back to mock.", e);
                return null; 
            }
        };

        // --- COMPONENT: CHAT BUBBLE ---
        const ChatBubble = ({ type, title, initialMessage }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ role: 'system', text: initialMessage }]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);

            useEffect(() => {
                if (messages.length === 0) setMessages([{ role: 'model', text: initialMessage }]);
            }, []);

            const handleSend = async () => {
                if (!input.trim()) return;
                const userMsg = { role: 'user', text: input };
                const newHistory = [...messages, userMsg];
                setMessages(newHistory);
                setInput("");
                setIsTyping(true);

                const systemPrompt = type === 'therapist' 
                    ? "You are an empathetic AI therapist helping the user discover their attachment style and MBTI. Ask gentle probing questions. Keep responses concise."
                    : "You are the LMA support bot. Answer questions based on the project README: The goal is to verify human identity (face, body, id), create a digital twin, and monetize it across Adult, Music, Gaming, and Stock industries. We use Odoo for the backend and Gemini for AI.";

                const aiResponse = await callGeminiChat(newHistory, systemPrompt);
                
                setMessages(prev => [...prev, { role: 'model', text: aiResponse }]);
                setIsTyping(false);
            };

            return (
                <div className={`fixed bottom-4 ${type === 'therapist' ? 'left-4' : 'right-4'} z-50 flex flex-col items-${type === 'therapist' ? 'start' : 'end'}`}>
                    {isOpen && (
                        <div className="glass-panel mb-4 p-4 rounded-xl w-80 h-96 flex flex-col shadow-2xl">
                            <div className="flex justify-between items-center border-b border-gray-600 pb-2 mb-2">
                                <h3 className={`font-bold text-sm ${type === 'therapist' ? 'text-green-400' : 'text-indigo-400'}`}>{title}</h3>
                                <button onClick={() => setIsOpen(false)} className="text-gray-400 hover:text-white">&times;</button>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-3 text-xs p-1">
                                {messages.map((m, i) => (
                                    <div key={i} className={`p-2 rounded-lg ${m.role === 'user' ? 'bg-indigo-600 ml-auto text-white' : 'bg-gray-700 mr-auto text-gray-200'} max-w-[85%]`}>
                                        {m.text}
                                    </div>
                                ))}
                                {isTyping && <div className="text-gray-500 animate-pulse text-xs">AI is typing...</div>}
                            </div>
                            <div className="mt-2 flex gap-2">
                                <input 
                                    type="text" 
                                    className="flex-1 glass-input rounded px-2 py-2 text-xs"
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                    placeholder="Type message..."
                                />
                                <button onClick={handleSend} className="bg-indigo-600 p-2 rounded hover:bg-indigo-500 text-white">
                                    <Icon name="send" size={14} />
                                </button>
                            </div>
                        </div>
                    )}
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className={`p-3 rounded-full shadow-lg transition-all hover:scale-110 ${type === 'therapist' ? 'bg-green-600' : 'bg-blue-600'}`}
                    >
                        <Icon name={type === 'therapist' ? 'brain' : 'help'} color="white" />
                    </button>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [userSelfie, setUserSelfie] = useState(null);
            const [userPet, setUserPet] = useState(null);
            const [userProduct, setUserProduct] = useState(null);
            const [cvFile, setCvFile] = useState(null);
            const [generatedAssets, setGeneratedAssets] = useState([]);
            const [verificationStep, setVerificationStep] = useState(1);
            
            const [yogaOptions, setYogaOptions] = useState({ type: 'Yoga', focus: 'Full Body', speed: 'Normal', audio: true });
            const [ppvOptions, setPpvOptions] = useState({ gender: 'Female', tattoos: false });

            useEffect(() => {
                const savedSelfie = localStorage.getItem('lma_selfie');
                if (savedSelfie) { setUserSelfie(savedSelfie); setVerificationStep(prev => Math.max(prev, 2)); }
                const savedPet = localStorage.getItem('lma_pet');
                if (savedPet) setUserPet(savedPet);
                const savedProd = localStorage.getItem('lma_product');
                if (savedProd) setUserProduct(savedProd);
                const savedAssets = JSON.parse(localStorage.getItem('lma_assets') || "[]");
                setGeneratedAssets(savedAssets);
            }, []);

            const handleFileUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (type === 'cv') {
                    setCvFile(file.name);
                    setVerificationStep(prev => Math.max(prev, 5));
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result;
                    if (type === 'selfie') {
                        setUserSelfie(base64);
                        localStorage.setItem('lma_selfie', base64);
                        setVerificationStep(prev => Math.max(prev, 2));
                    } else if (type === 'pet') {
                        setUserPet(base64);
                        localStorage.setItem('lma_pet', base64);
                    } else if (type === 'product') {
                        setUserProduct(base64);
                        localStorage.setItem('lma_product', base64);
                    }
                };
                reader.readAsDataURL(file);
            };

            const clearData = () => {
                localStorage.clear();
                setUserSelfie(null);
                setUserPet(null);
                setUserProduct(null);
                setCvFile(null);
                setGeneratedAssets([]);
                setVerificationStep(1);
                alert("Local data cleared!");
            };

            const downloadAsset = (asset) => {
                const link = document.createElement('a');
                link.href = asset.image;
                link.download = `LMA_${asset.type.replace(/\s/g,'_')}_${asset.id}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const runJob = async (jobType) => {
                const newAssetId = Date.now();
                const newAssetTemp = { id: newAssetId, type: jobType, status: 'Processing...', image: PLACEHOLDER_IMG };
                setGeneratedAssets(prev => [newAssetTemp, ...prev]);

                let prompt = "";
                if (jobType === 'Pet Stock') prompt = "A cute, high-quality commercial stock photo of the pet provided.";
                if (jobType === 'Product Model') prompt = "A professional model wearing/holding the provided product, white background studio shot.";
                if (jobType === 'Yoga Flow') prompt = `A person performing a ${yogaOptions.speed} ${yogaOptions.type} pose focused on ${yogaOptions.focus}, photorealistic, calm lighting.`;
                if (jobType === 'Adult PPV') prompt = `A highly attractive ${ppvOptions.gender} model, ${ppvOptions.tattoos ? "with artistic tattoos" : "no tattoos"}, cinematic lighting, elegant, safe for work but alluring.`;
                if (jobType === 'Random Stock') prompt = "A person smiling in a casual coffee shop setting, lifestyle photography.";

                let resultImage = PLACEHOLDER_IMG;
                try {
                    const realImg = await callImagen(prompt);
                    if (realImg) resultImage = realImg;
                } catch (e) {
                    console.log("Using placeholder due to API restrictions");
                }

                setGeneratedAssets(prev => {
                    const updated = prev.map(a => 
                        a.id === newAssetId 
                        ? { ...a, status: 'Completed', image: resultImage } 
                        : a
                    );
                    localStorage.setItem('lma_assets', JSON.stringify(updated));
                    return updated;
                });
            };

            return (
                <div className="min-h-screen p-6 flex flex-col gap-8 max-w-7xl mx-auto pb-20">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-700 pb-6">
                        <div>
                            <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-1">
                                LMA Creator Dashboard
                            </h1>
                            <p className="text-gray-400 text-sm">One Identity. Many Outputs. <span className="text-green-400 bg-green-900/30 px-2 py-0.5 rounded text-xs ml-2">Local MVP</span></p>
                        </div>
                        
                        <div className="mt-4 md:mt-0 flex gap-4 items-center">
                            <button onClick={clearData} className="flex items-center gap-1 text-xs bg-red-900/40 text-red-400 hover:bg-red-900/60 px-3 py-2 rounded transition-colors">
                                <Icon name="trash" size={14} /> Clear Local Data
                            </button>
                            <div className="glass-panel px-4 py-2 rounded-lg text-right">
                                <p className="text-gray-400 text-xs uppercase font-bold">Total Earnings</p>
                                <p className="text-green-400 font-mono font-bold text-xl">$1,240.50</p>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="glass-panel p-6 rounded-xl border border-gray-700/50">
                                <h2 className="text-xl font-bold mb-6 flex items-center gap-2 text-white">
                                    <Icon name="id-card" className="text-indigo-400"/> Verification
                                </h2>
                                <div className="space-y-3">
                                    {VerificationLevels.map((step) => (
                                        <div key={step.level} className={`flex items-center justify-between p-3 rounded-lg border transition-all ${verificationStep >= step.level ? 'border-green-500/30 bg-green-900/10' : 'border-gray-700 bg-gray-800/30'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2 rounded-full ${verificationStep >= step.level ? 'bg-green-500/20 text-green-400' : 'bg-gray-700 text-gray-500'}`}>
                                                    <Icon name={step.icon} size={16} />
                                                </div>
                                                <div>
                                                    <p className={`text-sm font-bold ${step.status === "Coming Soon" ? "text-gray-500" : "text-gray-200"}`}>{step.title}</p>
                                                    <p className="text-xs text-gray-400">{verificationStep >= step.level ? "Completed" : step.status}</p>
                                                </div>
                                            </div>
                                            {verificationStep >= step.level && <Icon name="check" className="text-green-400" size={16}/>}
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 space-y-3">
                                    <label className={`block w-full cursor-pointer group p-3 rounded-lg border border-dashed text-center transition-colors ${userSelfie ? 'border-green-500/50 bg-green-900/10' : 'border-indigo-500/50 hover:bg-indigo-900/20'}`}>
                                        <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, 'selfie')} />
                                        <div className="flex items-center justify-center gap-2 text-sm">
                                            <Icon name="camera" className={userSelfie ? "text-green-400" : "text-indigo-400"} size={16}/>
                                            <span className={userSelfie ? "text-green-300" : "text-indigo-300"}>{userSelfie ? "Selfie Updated" : "Upload Selfie"}</span>
                                        </div>
                                    </label>
                                    <label className={`block w-full cursor-pointer group p-3 rounded-lg border border-dashed text-center transition-colors border-gray-600 hover:bg-gray-700/30`}>
                                        <input type="file" className="hidden" accept=".pdf,.doc,.docx" onChange={(e) => handleFileUpload(e, 'cv')} />
                                        <div className="flex items-center justify-center gap-2 text-sm">
                                            <Icon name="file-text" className={cvFile ? "text-green-400" : "text-gray-400"} size={16}/>
                                            <span className={cvFile ? "text-green-300" : "text-gray-400"}>{cvFile ? "CV: " + cvFile : "Upload CV"}</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-8 space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="glass-panel p-5 rounded-xl border-t-4 border-t-yellow-500">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="dog" size={18}/> Pet Stock</h3>
                                        <span className="text-[10px] bg-yellow-500/20 text-yellow-300 px-2 py-1 rounded uppercase font-bold tracking-wide">Free</span>
                                    </div>
                                    <div className="mb-4 h-32 bg-gray-800/50 rounded-lg flex items-center justify-center overflow-hidden relative">
                                        {userPet ? <img src={userPet} className="w-full h-full object-cover opacity-80" /> : <span className="text-gray-600 text-sm">No Pet Uploaded</span>}
                                    </div>
                                    <div className="flex gap-2">
                                        <label className="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-xs cursor-pointer flex-1 text-center">
                                            Upload Pet <input type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'pet')} />
                                        </label>
                                        <button onClick={() => runJob('Pet Stock')} disabled={!userPet} className={`flex-1 py-2 rounded text-xs font-bold ${userPet ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-gray-800 text-gray-500'}`}>Generate</button>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-xl border-t-4 border-t-blue-500">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="shopping-bag" size={18}/> Product Model</h3>
                                        <span className="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-1 rounded uppercase font-bold tracking-wide">Standard</span>
                                    </div>
                                    <div className="text-xs text-gray-400 mb-2 p-2 bg-gray-800 rounded">⚠️ Must upload a product image.</div>
                                    <div className="flex gap-2 mb-4">
                                        <label className={`flex-1 p-2 text-center rounded text-xs cursor-pointer border ${userProduct ? 'border-blue-500 bg-blue-900/20' : 'border-gray-600 bg-gray-800'}`}>
                                            {userProduct ? "Product Ready" : "Upload Product"}
                                            <input type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'product')} />
                                        </label>
                                    </div>
                                    <button onClick={() => runJob('Product Model')} disabled={!userSelfie || !userProduct} className={`w-full py-2 rounded text-xs font-bold ${userSelfie && userProduct ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-gray-800 text-gray-500'}`}>Generate</button>
                                </div>

                                <div className="glass-panel p-5 rounded-xl border-t-4 border-t-green-500">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="activity" size={18}/> How-To Video</h3>
                                        <span className="text-[10px] bg-green-500/20 text-green-300 px-2 py-1 rounded uppercase font-bold tracking-wide">Video</span>
                                    </div>
                                    <div className="space-y-2 mb-4">
                                        <div className="grid grid-cols-2 gap-2">
                                            <select className="glass-input p-1 rounded text-xs" value={yogaOptions.type} onChange={e => setYogaOptions({...yogaOptions, type: e.target.value})}>
                                                <option>Yoga</option><option>Pilates</option>
                                            </select>
                                            <select className="glass-input p-1 rounded text-xs" value={yogaOptions.focus} onChange={e => setYogaOptions({...yogaOptions, focus: e.target.value})}>
                                                <option>Full Body</option><option>Core</option><option>Flexibility</option>
                                            </select>
                                        </div>
                                        <div className="flex items-center justify-between text-xs text-gray-400">
                                            <span>Speak Names?</span>
                                            <input type="checkbox" checked={yogaOptions.audio} onChange={e => setYogaOptions({...yogaOptions, audio: e.target.checked})} />
                                        </div>
                                    </div>
                                    <button onClick={() => runJob('Yoga Flow')} disabled={!userSelfie} className={`w-full py-2 rounded text-xs font-bold ${userSelfie ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-gray-800 text-gray-500'}`}>Generate Flow</button>
                                </div>

                                <div className="glass-panel p-5 rounded-xl border-t-4 border-t-pink-500">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="zap" size={18}/> Adult PPV</h3>
                                        <span className="text-[10px] bg-pink-500/20 text-pink-300 px-2 py-1 rounded uppercase font-bold tracking-wide">NSFW</span>
                                    </div>
                                    <div className="space-y-2 mb-4">
                                         <select className="w-full glass-input p-1 rounded text-xs" value={ppvOptions.gender} onChange={e => setPpvOptions({...ppvOptions, gender: e.target.value})}>
                                            <option>Female Likeness</option><option>Male Likeness</option>
                                        </select>
                                        <div className="flex items-center justify-between text-xs text-gray-400 p-2 bg-gray-800 rounded">
                                            <span>Apply Tattoos?</span>
                                            <input type="checkbox" checked={ppvOptions.tattoos} onChange={e => setPpvOptions({...ppvOptions, tattoos: e.target.checked})} />
                                        </div>
                                    </div>
                                    <button onClick={() => runJob('Adult PPV')} disabled={!userSelfie} className={`w-full py-2 rounded text-xs font-bold ${userSelfie ? 'bg-pink-600 hover:bg-pink-500' : 'bg-gray-800 text-gray-500'}`}>Generate Asset</button>
                                </div>

                                <div className="glass-panel p-5 rounded-xl border-t-4 border-t-purple-500">
                                     <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="image" size={18}/> Random Stock</h3>
                                    </div>
                                    <p className="text-xs text-gray-400 mb-4">Generate random stock situations featuring you.</p>
                                     <button onClick={() => runJob('Random Stock')} disabled={!userSelfie} className={`w-full py-2 rounded text-xs font-bold ${userSelfie ? 'bg-purple-600 hover:bg-purple-500' : 'bg-gray-800 text-gray-500'}`}>Surprise Me</button>
                                </div>
                            </div>

                            <div className="mt-8">
                                <h3 className="text-xl font-bold mb-4 text-gray-300">Generated Assets</h3>
                                <div className="space-y-3">
                                    {generatedAssets.map((asset) => (
                                        <div key={asset.id} className="glass-panel p-3 rounded-lg flex gap-4 items-center animate-fade-in">
                                            <div className="w-16 h-16 bg-gray-900 rounded-md overflow-hidden flex-shrink-0">
                                                <img src={asset.image} className="w-full h-full object-cover" />
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex justify-between mb-1">
                                                    <h4 className="font-bold text-sm text-white">{asset.type}</h4>
                                                    <span className={`text-[10px] px-2 py-0.5 rounded ${asset.status === 'Completed' ? 'bg-green-900 text-green-300' : 'bg-yellow-900 text-yellow-300'}`}>{asset.status}</span>
                                                </div>
                                                {asset.status === 'Completed' && (
                                                    <button onClick={() => downloadAsset(asset)} className="mt-2 text-[10px] bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded flex items-center gap-1"><Icon name="download" size={10} /> Download File</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {generatedAssets.length === 0 && <div className="text-center p-6 border border-dashed border-gray-700 rounded-lg text-gray-500 text-sm">No assets generated yet.</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    <ChatBubble type="therapist" title="AI Therapist" initialMessage="Hello. I'm here to help verify your personality type. How are you feeling about your creative journey today?" />
                    <ChatBubble type="help" title="LMA Support" initialMessage="Welcome to LMA. I can help explain verification steps, pricing tiers, or how to upload assets." />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
